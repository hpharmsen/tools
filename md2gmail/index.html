<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD to Gmail</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        h1 { margin-bottom: 0.5rem; font-size: 1.8rem; }
        .subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .container { width: 100%; max-width: 900px; }
        .drop-zone { border: 2px dashed #ccc; border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; background: #fff; transition: all 0.2s; margin-bottom: 1.5rem; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: #4285f4; background: #e8f0fe; }
        .drop-zone p { font-size: 1.1rem; color: #666; }
        .drop-zone .hint { font-size: 0.85rem; color: #999; margin-top: 0.5rem; }
        .input-area { display: none; margin-bottom: 1.5rem; }
        .input-area textarea { width: 100%; height: 200px; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9rem; resize: vertical; }
        .actions { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: #4285f4; color: #fff; }
        .btn-primary:hover { background: #3367d6; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .status { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: none; font-size: 0.9rem; }
        .status.success { display: block; background: #e6f4ea; color: #1e7e34; }
        .status.error { display: block; background: #fce8e6; color: #c62828; }
        .preview-label { font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; color: #555; }
        .preview { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem 2rem; min-height: 100px; line-height: 1.6; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
        /* Gmail-like rendering styles */
        .preview h1 { font-size: 1.6rem; margin: 0.8rem 0 0.4rem; }
        .preview h2 { font-size: 1.3rem; margin: 0.7rem 0 0.35rem; }
        .preview h3 { font-size: 1.1rem; margin: 0.6rem 0 0.3rem; }
        .preview p { margin: 0 0 0.8rem; }
        .preview ul, .preview ol { margin: 0 0 0.8rem; padding-left: 1.5rem; }
        .preview li { margin-bottom: 0.25rem; }
        .preview code { background: #f1f3f4; padding: 0.15rem 0.4rem; border-radius: 3px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85em; }
        .preview pre { background: #f1f3f4; padding: 1rem; border-radius: 6px; overflow-x: auto; margin: 0 0 0.8rem; }
        .preview pre code { background: none; padding: 0; }
        .preview blockquote { border-left: 3px solid #ccc; padding-left: 1rem; color: #666; margin: 0 0 0.8rem; }
        .preview a { color: #1a73e8; }
        .preview table { border-collapse: collapse; margin: 0 0 0.8rem; }
        .preview th, .preview td { border: 1px solid #ddd; padding: 0.4rem 0.75rem; text-align: left; }
        .preview th { background: #f1f3f4; font-weight: 600; }
        .preview hr { border: none; border-top: 1px solid #ddd; margin: 1rem 0; }
        .preview img { max-width: 100%; }
    </style>
</head>
<body>
    <h1>MD to Gmail</h1>
    <p class="subtitle">Convert Markdown to Gmail-ready formatted text</p>
    <div class="container">
        <div class="drop-zone" id="dropZone">
            <p>Drop a .md file here or click to select</p>
            <p class="hint">Or paste Markdown text below</p>
            <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
        </div>
        <div class="input-area" id="inputArea">
            <textarea id="mdInput" placeholder="Paste your Markdown here..."></textarea>
        </div>
        <div class="actions">
            <button class="btn-secondary" id="togglePaste">Paste text instead</button>
            <button class="btn-primary" id="convertBtn" style="display:none">Convert & Copy to Clipboard</button>
            <button class="btn-secondary" id="resetBtn" style="display:none">Reset</button>
        </div>
        <div class="status" id="status"></div>
        <div id="previewContainer" style="display:none">
            <p class="preview-label">Preview (this is what will be pasted in Gmail):</p>
            <div class="preview" id="preview"></div>
        </div>
    </div>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const inputArea = document.getElementById('inputArea');
        const mdInput = document.getElementById('mdInput');
        const togglePaste = document.getElementById('togglePaste');
        const convertBtn = document.getElementById('convertBtn');
        const resetBtn = document.getElementById('resetBtn');
        const status = document.getElementById('status');
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('previewContainer');

        let pasteMode = false;

        marked.setOptions({ breaks: true, gfm: true });

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

        togglePaste.addEventListener('click', () => {
            pasteMode = !pasteMode;
            inputArea.style.display = pasteMode ? 'block' : 'none';
            togglePaste.textContent = pasteMode ? 'Drop file instead' : 'Paste text instead';
            dropZone.style.display = pasteMode ? 'none' : 'block';
            convertBtn.style.display = pasteMode ? 'inline-block' : 'none';
            if (pasteMode) mdInput.focus();
        });

        convertBtn.addEventListener('click', () => convert(mdInput.value));

        resetBtn.addEventListener('click', () => {
            mdInput.value = '';
            previewContainer.style.display = 'none';
            resetBtn.style.display = 'none';
            status.className = 'status';
            if (!pasteMode) {
                convertBtn.style.display = 'none';
            }
        });

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = e => convert(e.target.result);
            reader.readAsText(file);
        }

        function convert(md) {
            if (!md.trim()) { showStatus('No content to convert.', 'error'); return; }
            const html = marked.parse(md);
            preview.innerHTML = html;
            previewContainer.style.display = 'block';
            resetBtn.style.display = 'inline-block';
            copyToClipboard(html);
        }

        async function copyToClipboard(html) {
            try {
                const blob = new Blob([html], { type: 'text/html' });
                const plainBlob = new Blob([preview.innerText], { type: 'text/plain' });
                await navigator.clipboard.write([
                    new ClipboardItem({ 'text/html': blob, 'text/plain': plainBlob })
                ]);
                showStatus('Copied to clipboard! Paste directly into your Gmail draft.', 'success');
            } catch (err) {
                showStatus('Could not copy automatically. Select the preview text and copy manually.', 'error');
            }
        }

        function showStatus(msg, type) {
            status.textContent = msg;
            status.className = 'status ' + type;
        }

        // Also handle paste anywhere on the page when not in paste mode
        document.addEventListener('paste', e => {
            if (pasteMode && document.activeElement === mdInput) return;
            const text = e.clipboardData.getData('text/plain');
            if (text.trim()) convert(text);
        });
    </script>
</body>
</html>
